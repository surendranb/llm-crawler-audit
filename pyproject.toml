[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-crawler-audit"
version = "0.1.0"
description = "AI & LLM crawler readiness MCP server: audit robots.txt, validate llms.txt, and verify markdown mirrors for GEO/AEO optimization."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Surendran B", email = "reachsuren@gmail.com" }]
keywords = ["mcp", "mcp-server", "llm-crawler", "robots-txt", "llms-txt", "geo", "aeo", "ai-search", "gptbot", "claudebot", "perplexitybot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Homepage = "https://llm-crawler.builditwithai.xyz"
Repository = "https://github.com/surendranb/llm-crawler-audit.git"
Issues = "https://github.com/surendranb/llm-crawler-audit/issues"

[project.scripts]
llm-crawler-audit = "llm_crawler_audit.server:main"
llm-crawler-mcp = "llm_crawler_audit.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_crawler_audit = ["skills/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
